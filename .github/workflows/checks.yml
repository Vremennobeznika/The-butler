name: Butler checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax
        run: |
          node --check model.js
          node --check app.js
          node --check config.js
          node --check extras.js
          node --check sw.js
      - name: Run planner tests
        run: node --test tests/*.test.cjs
      - name: Test local Mac helper\n        run: python3 -m unittest discover -s mac-tools/tests -v\n      - name: Check macOS shell scripts\n        run: bash -n mac-tools/*.sh\n      - name: Validate macOS helper Python syntax
        run: python3 -m py_compile mac-tools/mac_reminders.py
